services:
  - type: web
    name: lared-imagen-api
    env: python
    buildCommand: pip install -r requirements.txt && apt-get install -y fonts-liberation
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: CLOUDINARY_CLOUD_NAME
        value: dd9cuovet
      - key: CLOUDINARY_API_KEY
        value: "436436496366223"
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Watchdog del scenario de Make (alerta + auto-recuperacion)
      - key: MAKE_API_TOKEN
        sync: false
      - key: ALERT_SMTP_USER
        sync: false
      - key: ALERT_SMTP_PASS
        sync: false
      - key: ALERT_TO
        value: gvelarde@rcn.com.gt
      - key: WATCHDOG_ENABLED
        value: "1"
      - key: ALERT_THRESHOLD_MIN
        value: "45"
      - key: WATCHDOG_FEED_URL
        value: https://lared-imagen-api.onrender.com/rss-proxy
    plan: free
